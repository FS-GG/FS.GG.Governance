# skill-view-check — the REQUIRED skill gate, and the replacement for the retired `skill-union` caller.
#
# ADR-0067 §8 (the loud absence check) and §9 (nothing is retired before its replacement is proven).
# Decided on FS-GG/.github#1715 as blocker B5 of
# `docs/coordination/skill-apparatus-retirement-order.md` §5, shape (b), with the repository owner's
# authorization. This file IS that replacement, and it landed BEFORE the caller it replaces was
# deleted and before the required context moved — see THE SWAP below.
#
# WHAT THIS REPO USED TO REQUIRE, AND WHY IT STOPPED MEANING ANYTHING. `.github/workflows/skill-union.yml`
# was a `uses:` of FS-GG/.github's reusable `skill-union-assert.yml`, and its context
# `skill-union / skill-union` was a required status check on `main`. That gate asserts one thing: the
# runtime roots hold the BYTE-IDENTICAL UNION of the same skills. ADR-0067 phase 4 makes one of those
# roots a generated VIEW of the other — a symlink, resolved at checkout, never committed (§6) — and on
# that layout the gate's two headline invariants both become tautologies. Measured on this repo's own
# tree, at a dry-run retirement, 2026-07-28:
#
#   skill-union-assert --roots ".agents/skills"                    -> exit 2, "no skills found under
#                                                                      any root"
#   skill-union-assert --roots ".claude/skills .agents/skills"     -> exit 0, "in-every-root=15/15
#                                                                      byte-identical=15/15 ... OK"
#
# Read those two together. `union_ids()` enumerates with `find` and no `-L`, so the VIEW ROOT
# CONTRIBUTES ZERO IDS — that is the first line, on its own. Every one of the 15 ids in the second line
# therefore came from the tracked root alone, and the view root passed the presence test only because
# presence is `[ -d ]` **through** the symlink, which cannot fail. "byte-identical=15/15" is 15
# comparisons of a file with itself. The gate would have kept reporting `success` on a REQUIRED context
# while asserting nothing about the view — a green indistinguishable from a green that means something,
# which is epic #266 in its most expensive form.
#
# WHAT THIS ASSERTS INSTEAD. `skill-view check --source .claude/skills`: every skill the SOURCE
# directory declares is VISIBLE at every runtime root the contract still names, with ADR-0067 §8's
# absence classes reported separately — [absent-root], [dangling-root], [text-file-root],
# [not-a-directory-root], [missing-skill], [dangling-skill], [not-a-file-skill], [unreadable-skill],
# [empty-skill]. Those are the failure modes phase 1 (FS-GG/.github#1621) measured as **exit 0 with no
# diagnostic in BOTH runtimes** (Claude Code 2.1.220, Codex CLI 0.145.0) — an agent that quietly has no
# skills. This check is the only thing that says so.
#
# AND IT CAN FAIL, WHICH IS THE ENTIRE JUSTIFICATION FOR THE SWAP. Mutation-checked on this repo's own
# tree rather than asserted (FS-GG/.github#1715 AC3):
#
#   the generated view removed   -> exit 1, "[absent-root] .agents/skills does not exist"
#   the source root emptied      -> exit 2, "the expected skill set is EMPTY — refusing to report
#                                    'everything is visible' over nothing"
#
# A leg that survives its own mutation is repaired or dropped, never shipped. Both mutations red this
# one, in CI, by run id; the ids are in FS-GG/.github#1715.
#
# WHAT IT DOES **NOT** ASSERT, SAID OUT LOUD. It does not compare the two roots' BYTES against each
# other, so while this repo still commits two independent copies of its skills it is weaker than the
# union gate in exactly that one direction: a skill present in `.agents/skills` and absent from
# `.claude/skills` is outside its subject. That direction stops existing the moment `.agents/skills`
# becomes a view of `.claude/skills` — a view cannot diverge from what it is a view of — so the gap is
# bounded by this repo's own ADR-0067 phase 4 retirement (FS-GG/.github#1676) and is recorded there.
# `kit / coordination-kit` continues to grade the kit-owned skills' bytes against this repo's pin
# throughout. Do not read that as coverage of the rest: a `coordination-coherence` green is evidence
# about the kit's skills, never about the tree (FS-GG/.github#1504).
#
# THE TOOL IS THIS REPO'S OWN COPY, NEVER A MOVING HUB `main`. `scripts/skill-view` is delivered and
# byte-verified by the `FS.GG.Kit` version this repo pins (a kit row since 0.15.0), together with the
# two libraries it sources at load, `scripts/lib/args.sh` and `scripts/lib/roots.sh` — `repos.sh
# validate` refuses a kit that separates them. A receiver's verdict must be a function of the receiver
# (FS-GG/.github#1584); that is also the difference from the workflow this replaces, whose script came
# from the authority's `@main` on every run.
#
# THE ROOT SET IS NOT NAMED HERE, DELIBERATELY. No `--roots`, so it comes from `lib/roots.sh` — the same
# precedence parser every other reader in this repo resolves with (FS-GG/.github#525): `--roots` >
# `$AGENT_SKILL_ROOTS` > `.agent-skill-roots` > the default. This repo commits no `.agent-skill-roots`,
# so the effective set is ADR-0065's two as amended by ADR-0067 §5 — `.claude/skills .agents/skills` —
# which is the SAME set the retired caller audited, so this swap narrows nothing. `.codex/skills` is in
# no gate's subject: ADR-0067 §5 retired it from the runtime contract. Do NOT add `--roots` to "fix"
# that; it would re-arm a gate on a root the contract retired, and widening or narrowing the audited
# set is a declared decision, not a caller's convenience.
#
# THE `pull_request` TRIGGER CARRIES NO `paths:` FILTER, AND MUST NOT GAIN ONE. The context below is
# REQUIRED on `main`. GitHub does not synthesise a neutral check run for a workflow a path filter
# excluded — it never creates the check run at all — and branch protection cannot tell that apart from
# a check that has not reported yet, so it holds every unrelated pull request at "Expected — waiting for
# status to be reported", forever. The org has already paid for that combination twice, both times in
# FS.GG.SDD (#370, #525), and the sibling required gates in this repo carry the same standing note.
# `scripts/
# check-required-contexts.py` now models it and `required-context-coherence.yml` sweeps for it nightly,
# but the deadlock is still yours to avoid. Keeping the filter on `push:` is safe and is not the same
# question: a `push` filter has no bearing on what a pull request reports.
#
# THE JOB NAME IS PUBLIC API. Branch protection requires the literal context string this job produces.
# Renaming the job renames the context, the required one then never reports, and the repository stops
# merging with no commit in it having changed — the FS.GG.Audio#60 shape that
# `docs/coordination/reusable-workflow-contract.md` exists for. Change it only by sequencing it against
# the protection setting, never as a tidy-up.
#
# THE SWAP WAS ATOMIC, AND THE ORDER IS THE POINT (FS-GG/.github#1715 AC4). Producer first, requirement
# second, old producer last:
#   1. this file landed on `main`, reporting on its own pull request, while `skill-union` was still
#      required and still reporting;
#   2. `skill-view-check` was added to the required contexts (`scripts/repos.sh require-context`, an
#      ADD-ONLY verb that cannot delete);
#   3. `skill-union / skill-union` was removed from them (`unrequire-context`, a separate verb with its
#      own `--confirm-remove`);
#   4. only then was `.github/workflows/skill-union.yml` deleted.
# At no instant did this branch require a context no workflow could report. Reversing steps 3 and 4 is
# the wedge; there is never a reason to.
#
# =================================================================================================
# THE SECOND COMMITTED ROOT WAS RETIRED, AND THIS FILE CHANGED IN THAT SAME PULL REQUEST.
# =================================================================================================
# DONE 2026-07-28 by ADR-0067 phase 4 (FS-GG/.github#1676, #1748). `.agents/skills` is untracked and
# git-ignored, so a VIEW root does not exist in a fresh checkout — a clean clone, a new worktree and
# this runner alike. Without a generate the check below correctly reports `[absent-root]` and this
# required context is RED on every pull request. Measured on a bare checkout of the retired tree of
# THIS repo, 2026-07-28: `[absent-root] .agents/skills does not exist`, exit 1.
#
# So the generate is the step immediately below, added in the SAME commit that untracks the root —
# never before it (`skill-view generate` refuses a root git TRACKS, with no override, and would die)
# and never after it (that is the RED window on every pull request).
#
# `--roots` names the VIEW roots explicitly, exactly as `FsggKitViewSkillRoots` does for the
# materializer: letting the tool fall back to the default pair would also try to resolve
# `.claude/skills`, this repo's tracked source, and be a refusal rather than a no-op.
#
# It is NOT conditional on whether the root happens to be missing, and it must never become so.
# "Generate whatever is absent, then assert it is present" is the fail-open shape this whole item
# exists to remove: it would make [absent-root] unreachable and hand back a gate that cannot fail. The
# generate is authorised by the repo DECLARING a root to be a view — in `<FsggKitViewSkillRoots>`,
# `.config/kit/FS.GG.Kit.receiver.proj` — never by observing that one is missing.
#
# THAT DISTINCTION IS ABOUT AUTHORISATION, NOT REACHABILITY, AND THIS PARAGRAPH USED TO CLAIM BOTH
# (FS-GG/.github#1869). The sentence above said a conditional generate "would make [absent-root]
# unreachable and hand back a gate that cannot fail" — true, and equally true of the unconditional one
# written here. Both leave the root present by the time the check runs. Measured on a bare receiver
# checkout, 2026-07-29, running the assertion alone (`-t:FsggKitCheckSkillView`):
#
#   [absent-root]     rc 0 — the generate creates the view, the check then passes
#   [dangling-root]   rc 0 — the generate replaces the dangling link, same
#   [text-file-root]  rc 1 — but via `skill-view generate` REFUSING ("exists, is not a symlink, and
#                     carries no .skill-view receipt"), exit 2, BEFORE the check runs
#
# So none of ADR-0067 §8's three absence classes is this check's verdict on the per-PR path. That is
# STRUCTURAL, not an oversight: a view root is absent in every fresh checkout by construction (§6.1),
# a required context over it must generate first, so absence can never be what it reports. The
# unconditional-and-declared rule remains right for the reason it was written — it decides WHO may
# generate — and it never preserved the class's reachability.
#
# WHAT THIS CHECK ASSERTS HERE, THEN: that the generate SUCCEEDED and the SOURCE is complete. Both are
# real and both can fail — the text-file row above is one of them failing. §8's absence classes remain
# reachable, and are mutation-proven to fire, in FS-GG/.github's own `src/FS.GG.Kit/verify-package.sh`,
# whose fixtures deliberately do not generate (FS-GG/.github#1867).
#
# THE SAME GENERATE ALSO EXISTS IN THE RECEIVER PROJECT, AND THAT IS NOT A DUPLICATE. This workflow
# runs no MSBuild, so it needs its own step; `FsggGovernanceGenerateSkillView` covers the OTHER trees
# the view has to exist in — `gate.yml`'s required `Build-config drift check` job and, critically,
# `kit-materialize.yml`, which is a `uses:` of FS-GG/.github's reusable workflow and therefore cannot
# be given a step by this repo at all. Both were measured RED on a bare checkout of the retired tree
# without it.
#
# =================================================================================================
# THE §8 ALARM RIDES THIS CONTEXT, AND THAT IS WHY IT IS NOT DECORATION.
# =================================================================================================
# The retirement removes the only gate that would have noticed `.agents/skills` LEAVING the runtime
# contract later. Measured on this repo's own tree with `<FsggKitViewSkillRoots>` emptied and the
# directory deleted: the materialize reports "no view skill roots declared — nothing to assert" and
# succeeds, and `coordination-sync --check --against-pin` reports "OK — all 30 materialized file(s)" —
# and that second one IS the required context `kit / coordination-kit`. The required set passes on
# exactly the tree the alarm exists to fail. `skill-view check` (with the `receiver-proj` flag) is
# that alarm, and it runs here because `skill-view-check` is REQUIRED on `main` and needs no .NET SDK
# or restore.
#
# IT USED TO BE `scripts/check-skill-view-roots.sh`, 14,864 BYTES OF THIS REPO'S OWN
# (FS-GG/.github#1710/#1777). Five receivers retired their second committed skill root, ADR-0067 §8
# obliged each to replace the loud failure it removed, and each hand-wrote the same alarm on the same
# day: 23,050 / 21,353 / 18,346 / 18,277 / 14,864 bytes for one invariant. The delivery seam already
# existed — `scripts/skill-view` is a kit-delivered file this repo pins and byte-verifies — so the
# assertion lives THERE now and this repo calls it.
#
# ADOPTING IT FIXES A DEFECT IN THIS REPO'S COPY BY CONSTRUCTION RATHER THAN BY REPAIR. That copy
# guarded absence with a bare `[[ ! -e "$path" ]]`, which FOLLOWS symlinks, so a DANGLING view root —
# ADR-0067 §8's headline class — took the ABSENT branch and the branch whose message names dangling
# was unreachable for the case it names. Measured on this repo's tree, 2026-07-28, with
# `.agents/skills` pointed at a nonexistent target: the copy exits 1 saying *"declared runtime root
# '.agents/skills' does not exist"*; `skill-view check` exits 1 saying `[dangling-root] .agents/skills
# is a symlink that resolves to nothing (-> ../nonexistent-target)`. Both RED — this was a
# MISATTRIBUTED CLASS rather than a silent pass, and it is stated that way rather than inflated — but a
# diagnostic that names the wrong cause sends the reader to the wrong repair, and `classify_root` has
# always separated the four classes.

name: skill-view-check

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-view-check:
    name: skill-view-check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # UNCONDITIONAL, and ahead of both assertions. `.agents/skills` is a VIEW root: git-ignored, and
      # therefore absent in this checkout exactly as it is in every fresh clone. See the header block
      # for why this may be neither conditional nor moved.
      - name: Resolve the view roots this tree no longer commits
        run: bash scripts/skill-view generate --source .claude/skills --roots ".agents/skills"

      # The can-fire demonstration now ships INSIDE the tool (FS-GG/.github#1710/#1770), so this repo
      # runs the same one the hub does rather than a copy of it. The deleted script carried its own
      # `*_can_fire` fixtures; `selftest` is 16 cases and every negative one asserts the SPECIFIC
      # diagnostic class its branch emits — a demo that only counts failures survives a mutation
      # collapsing two branches into one, which is exactly how FS.GG.Audio#212 shipped green on a
      # dangling root for a day. Offline, about a second.
      - name: Demonstrate every lane of the skill-root alarm can fire
        run: bash scripts/skill-view selftest

      # ADR-0067 §8's replacement alarm AND this repo's visibility check, in ONE call — the two are
      # lanes of `skill-view check` since FS-GG/.github#1710.
      #
      # The `receiver-proj` flag is LANE 1, THE DECLARATION, and it is what replaces the deleted
      # script: the sorted union of <FsggKitSkillRoots> and <FsggKitViewSkillRoots> must be ADR-0011's
      # two roots, and an UNDECLARED property is a RED rather than an empty contribution. It runs
      # FIRST inside `check` and its fault is FATAL before the roots loop, so a broken DECLARATION is
      # reported as such rather than as a missing directory — the ordering the two separate steps used
      # to buy by hand.
      #
      # NO `absent-ok`, DELIBERATELY, and it is a property of this HOST rather than of the check. The
      # generate step above runs immediately before, and `FsggGovernanceGenerateSkillView` covers every
      # tree the materialize runs in, so by the time this runs the view MUST exist: absence means the
      # generate was removed or did not run. FS.GG.Audio's and FS.GG.Templates' hosts are bare
      # checkouts and legitimately excuse absence; importing that carve-out here would make the lane
      # unfalsifiable.
      #
      # The expected SKILL set is still the SOURCE directory, never a manifest: `registry`-style
      # manifests declare a subset of a tree's skills and would stay green over a tree that had lost
      # the rest, which is FS-GG/.github#1504's coherent-but-incomplete class. A source directory
      # cannot be a subset of itself. The kit's version grades a partial view PER SKILL BY IDENTITY
      # where the deleted script compared directory COUNTS, and adds a lane no copy here had: git must
      # TRACK nothing under a declared view root (adopted from FS.GG.Net's copy).
      - name: Assert the runtime skill-root declaration and every skill's visibility at every root
        run: |
          bash scripts/skill-view check \
            --source .claude/skills \
            --tree . \
            --receiver-proj .config/kit/FS.GG.Kit.receiver.proj

  # ---------------------------------------------------------------------------------------------------
  # THE WRITE SET OF THE OTHER SKILL-ROOT TOOL, WHICH NOTHING GRADED UNTIL NOW (FS.GG.Governance#338).
  #
  # `scripts/materialize-skill-roots.sh` PROJECTS the spec-kit union into derived roots. It is the only
  # tool in this repo that WRITES skill roots, and before #338 no workflow ran it — `grep -rn
  # materialize-skill-roots .github/` was empty. It stayed wrong through two contract changes as a
  # result: it kept `.codex/skills` (retired by ADR-0067 §5) and `.agents/skills` (a generated VIEW root
  # since FS-GG/.github#1748) in its write set, so `--check` exited 2 on an untouched `main`, and the
  # remedy its own failure message printed re-created four kit skill directories inside the retired
  # root — measured, 11 -> 15 entries.
  #
  # A job here rather than a new workflow: this file already owns the skill-root subject, and adding a
  # second workflow for a second skill-root question is the copying this repo is retiring.
  # ---------------------------------------------------------------------------------------------------
  materialize-write-set:
    name: materialize-skill-roots write set
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Deliberately does NOT generate the view first. Leg 1's whole subject is that a FRESH checkout —
      # where a git-ignored view root is absent by construction (ADR-0067 §6.1) — is not a
      # misconfiguration. Generating it here would make that leg unfalsifiable in the one environment
      # that reproduces it.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The test restores the kit receiver project itself, and refuses loudly if it cannot — the
      # script under test EVALUATES the kit declaration through MSBuild, and an unrestored project
      # returns the empty string for every property the kit DEFAULTS.
      - name: Every leg, each with the mutation that kills it recorded beside it
        run: bash scripts/tests/materialize-skill-roots.test.sh
